name: E2E tests

on:
  pull_request:
  # Also called by deploy.yml: a push to main only deploys if these tests pass
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Run Playwright tests (health-check, lead form, pages)
        run: npm run test:e2e
        env:
          # Tests mock the n8n endpoints; the default lead URL is used so the CSP matches prod
          PUBLIC_GOATCOUNTER_URL: ${{ vars.PUBLIC_GOATCOUNTER_URL }}
