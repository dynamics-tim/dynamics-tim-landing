<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../../public/assets/fonts/inter-latin.woff2) format('woff2');font-weight:100 900}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#070906;font-family:Inter,sans-serif;color:#F4F5F0;position:relative;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(700px 400px at 90% -10%,rgba(185,236,46,.18),transparent 60%),radial-gradient(500px 360px at -10% 120%,rgba(185,236,46,.08),transparent 60%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(244,245,240,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(244,245,240,.05) 1px,transparent 1px);background-size:72px 72px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;letter-spacing:.18em;text-transform:uppercase;color:#A3A99B}
.wrap{position:absolute;inset:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
h1{font-weight:800;letter-spacing:-.045em;line-height:.95;font-size:104px}
h1 span{color:#B9EC2E;display:block}
.foot{display:flex;align-items:center;gap:22px}
.foot img{width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(185,236,46,.7)}
.name{font-size:30px;font-weight:700;letter-spacing:-.02em}
.role{font-size:21px;color:#CDD1C6;margin-top:4px}
.pill{margin-left:auto;background:#B9EC2E;color:#070906;font-weight:700;font-size:22px;padding:16px 26px;border-radius:999px}
.corner{position:absolute;width:22px;height:22px;border-color:rgba(185,236,46,.6)}
</style></head><body><div class="glow"></div><div class="grid"></div>
<div class="corner" style="top:28px;left:28px;border-top:2px solid;border-left:2px solid"></div>
<div class="corner" style="bottom:28px;right:28px;border-bottom:2px solid;border-right:2px solid"></div>
<div class="wrap">
 <div class="mono">dynamics-tim.dev · D365 / Power Platform / Azure</div>
 <h1>Dein CRM verdient<span>bessere Releases.</span></h1>
 <div class="foot"><img src="../../public/images/tim-portrait.jpg"><div><div class="name">Tim Friedrich</div><div class="role">Senior Dynamics 365 Developer &amp; Technical Consultant</div></div><div class="pill">Kostenloser Health-Check →</div></div>
</div></body></html>
